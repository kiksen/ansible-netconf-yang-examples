---
- name: Beispiel - alle Port-Rollen, teils mehrfach aufgerufen
  hosts: switch
  gather_facts: false

  vars:
    access_ports:
      - interface: GigabitEthernet1/0/2
        vlan: 123
        voice_vlan: 500
        description: Arbeitsplatz
      - interface: GigabitEthernet1/0/3
        vlan: 123
        description: Drucker  # ohne Voice-VLAN
      - interface: GigabitEthernet1/0/4
        vlan: 123
        description: Drucker  # ohne Voice-VLAN
      - interface: GigabitEthernet1/0/5
        vlan: 123
        description: Drucker  # ohne Voice-VLAN


  tasks:
    # - name: Access-Ports schreiben
    #   ansible.builtin.include_role:
    #     name: netconf/port/access
    #   vars:
    #     port_access_interface: "{{ item.interface }}"
    #     port_access_vlan: "{{ item.vlan }}"
    #     port_access_voice_vlan: "{{ item.voice_vlan | default(None) }}"
    #     port_access_description: "{{ item.description }}"
    #   loop: "{{ access_ports }}"
    #   loop_control:
    #     loop_var: item
    #     label: "{{ item.interface }}"

    - name: trunk
      ansible.builtin.include_role:
        name: netconf/port/trunk
      vars:
        port_trunk_allowed_vlans: 2-4094
        port_trunk_native_vlan: 920
        port_trunk_description: AccessPoint
        port_trunk_interface: GigabitEthernet1/0/5
        port_trunk_rep: true


