---
- name: Read the interfaces of the device from NetBox
  ansible.builtin.set_fact:
    interfaces2switch_interfaces: >-
      {{ query('netbox.netbox.nb_lookup', 'interfaces',
              api_filter='device=' ~ interfaces2switch_device
                ~ (' last_updated__gte=' ~ interfaces2switch_since if interfaces2switch_age_filter else ''),
              api_endpoint=lookup('ansible.builtin.env', 'NETBOX_ENDPOINT'),
              token=lookup('ansible.builtin.env', 'NETBOX_TOKEN'))
        | map(attribute='value') | list }}
  vars:
    # null or 0 switches the age filter off: all interfaces are read.
    interfaces2switch_age_filter: "{{ interfaces2switch_max_age_seconds is not none and interfaces2switch_max_age_seconds | int > 0 }}"
    interfaces2switch_since: >-
      {{ '%Y-%m-%dT%H:%M:%SZ' | strftime(now(utc=true).timestamp() | int - interfaces2switch_max_age_seconds | int, utc=true)
        if interfaces2switch_age_filter else '' }}

- name: Sort the interfaces by role
  ansible.builtin.set_fact:
    interfaces2switch_lags: >-
      {{ interfaces2switch_interfaces
        | selectattr('type.value', 'eq', 'lag')
        | selectattr('name', 'match', '^Port-channel[0-9]+$')
        | selectattr('mode') | list }}
    interfaces2switch_lags_without_mode: >-
      {{ interfaces2switch_interfaces
        | selectattr('type.value', 'eq', 'lag')
        | rejectattr('mode') | map(attribute='name') | list }}
    interfaces2switch_ports: >-
      {{ interfaces2switch_interfaces
        | rejectattr('mgmt_only')
        | rejectattr('type.value', 'in', interfaces2switch_ignored_types)
        | rejectattr('type.value', 'match', '^cisco-stack') | list }}

- name: Sort the physical ports by mode
  ansible.builtin.set_fact:
    interfaces2switch_members: "{{ interfaces2switch_ports | selectattr('lag') | list }}"
    interfaces2switch_access_ports: >-
      {{ interfaces2switch_ports | rejectattr('lag') | selectattr('mode')
        | selectattr('mode.value', 'eq', 'access') | list }}
    interfaces2switch_trunk_ports: >-
      {{ interfaces2switch_ports | rejectattr('lag') | selectattr('mode')
        | selectattr('mode.value', 'in', ['tagged', 'tagged-all']) | list }}
    interfaces2switch_unused_ports: >-
      {{ interfaces2switch_ports | rejectattr('enabled') | rejectattr('lag') | rejectattr('mode') | list }}

- name: Check the NetBox data before anything is written
  ansible.builtin.assert:
    that:
      - interfaces2switch_access_ports | rejectattr('untagged_vlan') | list | length == 0
      - interfaces2switch_trunk_ports | selectattr('mode.value', 'eq', 'tagged') | selectattr('tagged_vlans', 'equalto', []) | list | length == 0
      - interfaces2switch_lags | selectattr('mode.value', 'eq', 'tagged') | selectattr('tagged_vlans', 'equalto', []) | list | length == 0
      - interfaces2switch_lags | selectattr('mode.value', 'eq', 'access') | rejectattr('untagged_vlan') | list | length == 0
    fail_msg: >-
      NetBox data is incomplete: access ports and access LAGs need an untagged VLAN,
      tagged ports and tagged LAGs need tagged VLANs.
    quiet: true

- name: Report LAGs without a mode that are skipped
  ansible.builtin.debug:
    msg: "{{ interfaces2switch_lags_without_mode | join(', ') }} have no 802.1Q mode in NetBox and are skipped"
  when: interfaces2switch_lags_without_mode | length > 0

- name: Write the QoS policy-map referenced by the ports
  ansible.builtin.include_role:
    name: netconf/qos/policy_map

# The LAGs are written twice: before the members they only exist as interfaces; the switch stores
# some port-channel settings (standalone-disable-config) only when the channel has members.
- name: Create the LAG interfaces
  ansible.builtin.include_tasks: write_lags.yml

- name: Write the LAG members
  ansible.builtin.include_role:
    name: netconf/port/channel_member
  vars:
    port_channel_member_interface: "{{ item.name }}"
    port_channel_member_number: "{{ item.lag.name | regex_replace('[^0-9]', '') | int }}"
    port_channel_member_mode: "{{ interfaces2switch_member_mode }}"
    port_channel_member_description: "{{ item.description | default(item.name, true) }}"
    port_channel_member_enabled: "{{ item.enabled }}"
  loop: "{{ interfaces2switch_members }}"
  loop_control:
    label: "{{ item.name }}"

- name: Write the LAG interfaces again now that they have members
  ansible.builtin.include_tasks: write_lags.yml
  when: interfaces2switch_members | length > 0

- name: Write the access ports
  ansible.builtin.include_role:
    name: netconf/port/access
  vars:
    port_access_interface: "{{ item.name }}"
    port_access_vlan: "{{ item.untagged_vlan.vid }}"
    port_access_description: "{{ item.description | default(item.name, true) }}"
    port_access_enabled: "{{ item.enabled }}"
  loop: "{{ interfaces2switch_access_ports }}"
  loop_control:
    label: "{{ item.name }}"

- name: Write the trunk ports
  ansible.builtin.include_role:
    name: netconf/port/trunk
  vars:
    port_trunk_interface: "{{ item.name }}"
    port_trunk_description: "{{ item.description | default(item.name, true) }}"
    port_trunk_allowed_vlans: >-
      {{ 'all' if item.mode.value == 'tagged-all'
        else item.tagged_vlans | map(attribute='vid') | sort | list
          | with_native_vlan((item.untagged_vlan or {}).vid | default(none)) }}
    port_trunk_native_vlan: "{{ (item.untagged_vlan or {}).vid | default(none) }}"
    port_trunk_enabled: "{{ item.enabled }}"
  loop: "{{ interfaces2switch_trunk_ports }}"
  loop_control:
    label: "{{ item.name }}"

- name: Shut down disabled ports without a mode
  ansible.builtin.include_role:
    name: netconf/port/shutdown
  vars:
    port_shutdown_interface: "{{ item.name }}"
  loop: "{{ interfaces2switch_unused_ports }}"
  loop_control:
    label: "{{ item.name }}"
