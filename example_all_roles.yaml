---
- name: Beispiel - alle Port-Rollen, teils mehrfach aufgerufen
  hosts: switch
  gather_facts: false

  vars:
    access_ports:
      - interface: GigabitEthernet1/0/2
        vlan: 123
        voice_vlan: 500
        description: Arbeitsplatz
      - interface: GigabitEthernet1/0/3
        vlan: 123
        description: Drucker  # ohne Voice-VLAN
      - interface: GigabitEthernet1/0/4
        vlan: 123
        description: Drucker  # ohne Voice-VLAN
      - interface: GigabitEthernet1/0/5
        vlan: 123
        description: Drucker  # ohne Voice-VLAN


  tasks:
    - name: Access-Ports schreiben
      ansible.builtin.include_role:
        name: netconf/port/access
      vars:
        port_access_interface: GigabitEthernet1/0/5
        port_access_vlan: 100
        port_access_voice_vlan: 200
        port_access_description: Client and phone!

