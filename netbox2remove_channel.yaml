---
# Remove the port-channels from the switch that do not exist in NetBox. Dangerous, so it is a
# separate playbook. Look first with check mode (-C): the switch has no candidate datastore, so
# netconf_config writes nothing and reports changed for every channel it would remove.
#
#   uv run ansible-playbook -i inventory/netbox_switch.py netbox2remove_channel.yaml -C
#   uv run ansible-playbook -i inventory/netbox_switch.py netbox2remove_channel.yaml
#
# Environment: NETBOX_ENDPOINT, NETBOX_TOKEN (read-only). NetBox is only read.
# All LAGs of the device are read (no age filter). Role netconf/port/channel_remove strips the
# channel-group from the members of a removed channel first, then removes the channel.
# Afterwards run netbox2netconf.yaml to write the members of the remaining LAGs.
- name: Remove port-channels that are not in NetBox
  hosts: switches
  gather_facts: false

  tasks:
    - name: Read the names of all LAGs of the device from NetBox
      ansible.builtin.set_fact:
        nb_lag_names: >-
          {{ query('netbox.netbox.nb_lookup', 'interfaces',
                  api_filter='device=' ~ netbox_device ~ ' type=lag',
                  api_endpoint=lookup('ansible.builtin.env', 'NETBOX_ENDPOINT'),
                  token=lookup('ansible.builtin.env', 'NETBOX_TOKEN'))
            | map(attribute='value.name') | list }}

    - name: Stop if NetBox returned no LAG at all
      ansible.builtin.assert:
        that: nb_lag_names | length > 0
        fail_msg: "NetBox has no LAG for {{ netbox_device }}; refusing to remove every port-channel"
        quiet: true

    - name: Read the port-channels of the switch
      ansible.builtin.include_role:
        name: netconf/port/channel_facts

    - name: Find the port-channels that are not in NetBox
      ansible.builtin.set_fact:
        nb_stale_channels: "{{ port_channel_facts_list | difference(nb_lag_names) }}"

    - name: Show the port-channels that are not in NetBox
      ansible.builtin.debug:
        msg: "Port-channels not in NetBox: {{ nb_stale_channels }}"

    - name: Remove the port-channels
      ansible.builtin.include_role:
        name: netconf/port/channel_remove
      vars:
        port_channel_remove_interface: "{{ item }}"
      loop: "{{ nb_stale_channels }}"
