---
argument_specs:
  main:
    short_description: Read all ports and return them grouped by kind
    description:
      - Always reads all kinds. Sets port_facts_all, port_facts_access, port_facts_trunk,
        port_facts_member, port_facts_channel and port_facts_unconfigured.
      - Every entry has interface, kind, mode (access, tagged, tagged-all), description, enabled (false when shut down),
        untagged_vlan, voice_vlan, tagged_vlans, tagged_vlan_ranges, vlan_has_range, no_cdp_enable, no_lldp_transmit,
        no_lldp_receive, channel_group and channel_group_mode.
    options:
      port_facts_expand_vlans:
        type: bool
        required: false
        default: false
        description: >-
          List every tagged VLAN in tagged_vlans. Without it, runs of at least 4
          consecutive VLANs are reported as ranges (e.g. 102-200) in tagged_vlan_ranges.
