---
argument_specs:
  main:
    short_description: port-channel als Trunk per NETCONF schreiben
    options:
      port_channel_interface:
        type: str
        required: true
        description: Interface-Name, z.B. Port-channel2.
      port_channel_description:
        type: str
        required: true
        description: Interface-Description.
      port_channel_allowed_vlans:
        type: raw
        required: true
        description: >-
          Erlaubte VLANs: der String all (NetBox tagged-all), eine Liste
          (z.B. [100, 200, 300]), ein Range-String (z.B. 2-4094 oder 1,20-30)
          oder eine gemischte Liste (z.B. [1, "20-30", 100]). Gueltig 1-4094.
      port_channel_native_vlan:
        type: int
        required: false
        default: null
        description: Native-VLAN (NetBox untagged). Ohne Angabe wird ein vorhandenes Native-VLAN entfernt.
      port_channel_enabled:
        type: bool
        required: false
        default: true
        description: Administrative state of the interface; false writes shutdown, true removes it.
