---
- name: Write the LAG interfaces
  ansible.builtin.include_role:
    name: netconf/port/channel
  vars:
    port_channel_interface: "{{ item.name }}"
    port_channel_description: "{{ item.description | default(item.name, true) }}"
    port_channel_mode: "{{ 'access' if item.mode.value == 'access' else 'trunk' }}"
    port_channel_access_vlan: "{{ item.untagged_vlan.vid if item.mode.value == 'access' else none }}"
    port_channel_allowed_vlans: >-
      {{ none if item.mode.value == 'access'
        else 'all' if item.mode.value == 'tagged-all'
        else item.tagged_vlans | map(attribute='vid') | sort | list
          | with_native_vlan((item.untagged_vlan or {}).vid | default(none)) }}
    port_channel_native_vlan: >-
      {{ none if item.mode.value == 'access' else (item.untagged_vlan or {}).vid | default(none) }}
    port_channel_enabled: "{{ item.enabled }}"
  loop: "{{ interfaces2switch_lags }}"
  loop_control:
    label: "{{ item.name }}"
