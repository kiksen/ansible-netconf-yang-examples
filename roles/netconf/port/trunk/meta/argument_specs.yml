---
argument_specs:
  main:
    short_description: physical port als Trunk per NETCONF schreiben
    options:
      port_trunk_interface:
        type: str
        required: true
        description: Interface-Name, z.B. GigabitEthernet1/0/6.
      port_trunk_description:
        type: str
        required: true
        description: Interface-Description.
      port_trunk_allowed_vlans:
        type: raw
        required: true
        description: >-
          Erlaubte VLANs: der String all (NetBox tagged-all), eine Liste
          (z.B. [100, 200, 300]), ein Range-String (z.B. 2-4094 oder 1,20-30)
          oder eine gemischte Liste (z.B. [1, "20-30", 100]). Gueltig 1-4094.
      port_trunk_native_vlan:
        type: int
        required: false
        default: null
        description: Native-VLAN (NetBox untagged). Ohne Angabe wird ein vorhandenes Native-VLAN entfernt.
