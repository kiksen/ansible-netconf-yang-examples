---
argument_specs:
  main:
    short_description: Access-Port per NETCONF schreiben
    options:
      port_access_interface:
        type: str
        required: true
        description: Interface-Name, z.B. GigabitEthernet1/0/5 (auch Gi1/0/5).
      port_access_vlan:
        type: int
        required: true
        description: Access-VLAN.
      port_access_voice_vlan:
        type: int
        required: false
        default: null
        description: Voice-VLAN. Ohne Angabe wird ein vorhandenes Voice-VLAN entfernt.
      port_access_description:
        type: str
        required: true
        description: Interface-Description.
      port_access_no_cdp_enable:
        type: bool
        required: false
        default: null
        description: CDP auf dem Port deaktivieren (cdp enable = false). Bei false/ohne Angabe wird die Einstellung entfernt.
      port_access_no_lldp_transmit:
        type: bool
        required: false
        default: null
        description: LLDP-Senden deaktivieren (no lldp transmit). Bei false/ohne Angabe wird die Einstellung entfernt.
      port_access_no_lldp_receive:
        type: bool
        required: false
        default: null
        description: LLDP-Empfang deaktivieren (no lldp receive). Bei false/ohne Angabe wird die Einstellung entfernt.
      port_access_cleanup_elements:
        type: list
        elements: dict
        required: false
        description: Interface child elements that are removed before the port is written (only if present on the device).
        options:
          name:
            type: str
            required: true
            description: Element name, e.g. rep.
          namespace:
            type: str
            required: true
            description: XML namespace of the element, e.g. http://cisco.com/ns/yang/Cisco-IOS-XE-rep.
