---
argument_specs:
  main:
    short_description: Write a port-channel as trunk or access port per NETCONF
    options:
      port_channel_interface:
        type: str
        required: true
        description: Interface-Name, z.B. Port-channel2.
      port_channel_description:
        type: str
        required: true
        description: Interface description.
      port_channel_mode:
        type: str
        required: false
        default: trunk
        choices: [trunk, access]
        description: Switchport mode of the port-channel.
      port_channel_access_vlan:
        type: int
        required: false
        default: null
        description: Access VLAN; required, and only allowed, for mode access.
      port_channel_allowed_vlans:
        type: raw
        required: false
        default: null
        description: >-
          Required for mode trunk, not allowed for access. Allowed VLANs: the string all (NetBox tagged-all), a list
          (e.g. [100, 200, 300]), a range string (e.g. 2-4094 or 1,20-30)
          or a mixed list (e.g. [1, "20-30", 100]). Valid range 1-4094.
      port_channel_native_vlan:
        type: int
        required: false
        default: null
        description: Native VLAN (NetBox untagged). Without a value an existing native VLAN is removed.
      port_channel_enabled:
        type: bool
        required: false
        default: true
        description: Administrative state of the interface; false writes shutdown, true removes it.
      port_channel_storm_rising:
        type: float
        required: false
        default: 10.0
        description: Storm-control rising threshold in percent, used for broadcast and multicast.
      port_channel_storm_falling:
        type: float
        required: false
        default: 0.0
        description: Storm-control falling threshold in percent, used for broadcast and multicast.
