---
- name: Interface per NETCONF auslesen
  hosts: switch
  gather_facts: false

  vars:
    interface_name: GigabitEthernet1/0/5  # oder z.B. Port-channel1
    interface_type: "{{ interface_name | interface_part('type') }}"
    interface_id: "{{ interface_name | interface_part('id') }}"
    dump: ""  # -e dump=<name> schreibt das XML nach xml_example/<name>.xml

  tasks:
    - name: "{{ interface_type }}{{ interface_id }} aus dem Cisco-native Modell holen"
      ansible.netcommon.netconf_get:
        source: running
        display: xml
        filter: |
          <native xmlns="http://cisco.com/ns/yang/Cisco-IOS-XE-native">
            <interface>
              <{{ interface_type }}>
                <name>{{ interface_id }}</name>
              </{{ interface_type }}>
            </interface>
          </native>
      register: result

    - name: XML formatieren
      ansible.builtin.command:
        cmd: xmllint --format -
        stdin: "{{ result.stdout }}"
      register: pretty
      changed_when: false
      delegate_to: localhost

    - name: XML ausgeben
      ansible.builtin.debug:
        msg: "{{ pretty.stdout_lines }}"

    - name: Verzeichnis xml_example anlegen
      ansible.builtin.file:
        path: "{{ playbook_dir }}/xml_example"
        state: directory
        mode: "0755"
      when: dump | length > 0
      delegate_to: localhost

    - name: XML nach xml_example/{{ dump | basename }}.xml schreiben
      ansible.builtin.copy:
        content: "{{ pretty.stdout }}"
        dest: "{{ playbook_dir }}/xml_example/{{ dump | basename }}.xml"
        mode: "0644"
      when: dump | length > 0
      delegate_to: localhost
