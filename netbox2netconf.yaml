---
# Read the interfaces of one device from NetBox and write them to the switch with the NETCONF roles.
# The work is done by the role netbox/interfaces2switch (see its argument_specs.yml).
#
#   uv run ansible-playbook -i inventory/netbox_switch.py netbox2netconf.yaml
#
# Environment: NETBOX_ENDPOINT, NETBOX_TOKEN (read-only), optional NETBOX_DEVICE (default homidomi).
# Port-channels are never removed here; use netbox2remove_channel.yaml for that.
- name: Write NetBox interfaces to the switch
  hosts: switches
  gather_facts: false

  tasks:
    - name: Write the interfaces of the NetBox device
      ansible.builtin.include_role:
        name: netbox/interfaces2switch
      vars:
        interfaces2switch_device: "{{ netbox_device }}"
        # Only interfaces changed in the last N seconds are read from NetBox; null or 0 reads all.
        interfaces2switch_max_age_seconds: null
