[project]
name = "ansiblerepo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ansible>=13.7.0",
    "ansible-core>=2.20.6",
    "ansible-pylibssh>=1.4.0",
    "argcomplete>=3.7.2",
    "jxmlease>=1.0.3",
    "mypy>=2.4.1",
    "ncclient>=0.7.1",
    "paramiko>=5.0.0",
    "pynetbox>=7.9.0",
]

[dependency-groups]
dev = [
    "ansible-lint>=26.11.1",
    "lxml-stubs>=0.5.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
pythonpath = [
    "plugins/filter",
]
