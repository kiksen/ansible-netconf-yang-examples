---
# Read the running config of the switch and write it back with the NETCONF roles, so
# every port ends up in the standard form of the templates.
#
#   uv run ansible-playbook -i examples/inventory.yaml examples/netconf_rewrite.yaml
#
# The roles use replace: settings the templates do not model (rep, nonegotiate on trunks,
# custom storm-control values, ...) are reset to the role defaults. Unconfigured ports and
# port-channels without a switchport mode are skipped. A second run must report changed=0.
- name: Rewrite the running config in the standard form
  hosts: switch
  gather_facts: false

  roles:
    - role: kiksen.netconf.port_facts

  tasks:

    - name: Show all port facts
      ansible.builtin.debug:
        msg: "{{ port_facts_all }}"

    - name: Write some standard vlans
      ansible.builtin.include_role:
        name: kiksen.netconf.system_vlan
      vars:
        system_vlan_operation: merge
        system_vlan_list:
          - vid: 900
            name: Clients_900
          - vid: 950
            name: Guest
          - vid: 920
            name: AccessPoint_920


    - name: Write the QoS policy-map referenced by the ports
      ansible.builtin.include_role:
        name: kiksen.netconf.qos_policy_map

    - name: Rewrite the port-channels
      ansible.builtin.include_role:
        name: kiksen.netconf.port_channel
      vars:
        port_channel_interface: "{{ item.interface }}"
        port_channel_description: "{{ item.description | default(item.interface, true) }}"
        port_channel_mode: "{{ 'access' if item.mode == 'access' else 'trunk' }}"
        port_channel_access_vlan: "{{ item.untagged_vlan if item.mode == 'access' else none }}"
        port_channel_allowed_vlans: >-
          {{ none if item.mode == 'access'
            else 'all' if item.mode == 'tagged-all'
            else (item.tagged_vlans + item.tagged_vlan_ranges)
              | kiksen.netconf.with_native_vlan(item.untagged_vlan) }}
        port_channel_native_vlan: "{{ none if item.mode == 'access' else item.untagged_vlan }}"
        port_channel_enabled: "{{ item.enabled }}"
      # Channels without a switchport mode (e.g. Port-channel7) have nothing to normalize.
      loop: "{{ port_facts_channel | selectattr('mode') | list }}"
      loop_control:
        label: "{{ item.interface }}"

    - name: Rewrite the port-channel members
      ansible.builtin.include_role:
        name: kiksen.netconf.port_channel_member
      vars:
        port_channel_member_interface: "{{ item.interface }}"
        port_channel_member_number: "{{ item.channel_group }}"
        port_channel_member_mode: "{{ item.channel_group_mode }}"
        port_channel_member_description: "{{ item.description | default(item.interface, true) }}"
        port_channel_member_enabled: "{{ item.enabled }}"
      loop: "{{ port_facts_member }}"
      loop_control:
        label: "{{ item.interface }}"

    - name: Rewrite the trunk ports
      ansible.builtin.include_role:
        name: kiksen.netconf.port_trunk
      vars:
        port_trunk_interface: "{{ item.interface }}"
        port_trunk_description: "{{ item.description | default(item.interface, true) }}"
        port_trunk_allowed_vlans: >-
          {{ 'all' if item.mode == 'tagged-all'
            else (item.tagged_vlans + item.tagged_vlan_ranges)
              | kiksen.netconf.with_native_vlan(item.untagged_vlan) }}
        port_trunk_native_vlan: "{{ item.untagged_vlan }}"
        port_trunk_no_cdp_enable: "{{ item.no_cdp_enable }}"
        port_trunk_no_lldp_transmit: "{{ item.no_lldp_transmit }}"
        port_trunk_no_lldp_receive: "{{ item.no_lldp_receive }}"
        port_trunk_enabled: "{{ item.enabled }}"
      loop: "{{ port_facts_trunk }}"
      loop_control:
        label: "{{ item.interface }}"

    - name: Rewrite the access ports
      ansible.builtin.include_role:
        name: kiksen.netconf.port_access
      vars:
        port_access_interface: "{{ item.interface }}"
        port_access_vlan: "{{ item.untagged_vlan | default(1, true) }}"
        port_access_voice_vlan: "{{ item.voice_vlan }}"
        port_access_description: "{{ item.description | default(item.interface, true) }}"
        port_access_no_cdp_enable: "{{ item.no_cdp_enable }}"
        port_access_no_lldp_transmit: "{{ item.no_lldp_transmit }}"
        port_access_no_lldp_receive: "{{ item.no_lldp_receive }}"
        port_access_enabled: "{{ item.enabled }}"
      loop: "{{ port_facts_access }}"
      loop_control:
        label: "{{ item.interface }}"
