---
# Write the VLAN list of the switch. The list replaces ALL VLANs: VLANs that are not listed are removed.
#   uv run ansible-playbook -i inventory.yaml vlan_list.yaml
- name: Write the VLAN list per NETCONF
  hosts: switch
  gather_facts: false

  vars:
    system_vlan_list:
      - vid: 100
        name: Clients
      - vid: 123
        name: Printers
      - vid: 200
        name: Servers

  roles:
    - role: netconf/system/vlan
