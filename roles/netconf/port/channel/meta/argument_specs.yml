---
argument_specs:
  main:
    short_description: port-channel als Trunk per NETCONF schreiben
    options:
      port_channel_interface:
        type: str
        required: true
        description: Interface-Name, z.B. Port-channel2.
      port_channel_description:
        type: str
        required: true
        description: Interface-Description.
      port_channel_allowed_vlans:
        type: raw
        required: true
        description: >-
          Liste der erlaubten VLANs (z.B. [100, 200, 300]) oder der String all
          (NetBox tagged / tagged-all).
      port_channel_native_vlan:
        type: int
        required: false
        default: null
        description: Native-VLAN (NetBox untagged). Ohne Angabe wird ein vorhandenes Native-VLAN entfernt.
