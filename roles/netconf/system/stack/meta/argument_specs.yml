---
argument_specs:
  main:
    short_description: Read the stack members
    description:
      - Has no parameters. Sets system_stack_all, system_stack_globals, system_stack_tables,
        system_stack_members and system_stack_raw.
      - Keys keep the names of CISCO-STACKWISE-MIB, e.g. cswSwitchRole. system_stack_members is
        the list of cswSwitchInfoTable entries, one per stack member.
      - system_stack_raw is the unparsed reply, useful to see the fields the device really returns.
    options: {}
