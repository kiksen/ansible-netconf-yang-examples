---
argument_specs:
  main:
    short_description: Write an access port per NETCONF
    options:
      port_access_interface:
        type: str
        required: true
        description: Interface name, e.g. GigabitEthernet1/0/5 (Gi1/0/5 works too).
      port_access_vlan:
        type: int
        required: true
        description: Access VLAN.
      port_access_voice_vlan:
        type: int
        required: false
        default: null
        description: Voice VLAN. Without a value an existing voice VLAN is removed.
      port_access_description:
        type: str
        required: true
        description: Interface description.
      port_access_no_cdp_enable:
        type: bool
        required: false
        default: null
        description: Disable CDP on the port (cdp enable = false). With false or without a value the setting is removed.
      port_access_no_lldp_transmit:
        type: bool
        required: false
        default: null
        description: Disable LLDP transmit (no lldp transmit). With false or without a value the setting is removed.
      port_access_no_lldp_receive:
        type: bool
        required: false
        default: null
        description: Disable LLDP receive (no lldp receive). With false or without a value the setting is removed.
      port_access_service_policy_out:
        type: str
        required: false
        default: QUEUE-OUT
        description: Name of the policy-map applied as output service-policy.
      port_access_enabled:
        type: bool
        required: false
        default: true
        description: Administrative state of the interface; false writes shutdown, true removes it.
      port_access_storm_rising:
        type: float
        required: false
        default: 10.0
        description: Storm-control rising threshold in percent, used for broadcast and multicast.
      port_access_storm_falling:
        type: float
        required: false
        default: 0.0
        description: Storm-control falling threshold in percent, used for broadcast and multicast.
