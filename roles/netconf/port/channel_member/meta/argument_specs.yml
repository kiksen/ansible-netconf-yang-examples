---
argument_specs:
  main:
    short_description: Port als Port-Channel-Mitglied schreiben
    options:
      port_channel_member_interface:
        type: str
        required: true
        description: Interface-Name des physischen Ports, z.B. GigabitEthernet1/0/7.
      port_channel_member_number:
        type: int
        required: true
        description: Nummer des Port-Channels (channel-group).
      port_channel_member_mode:
        type: str
        required: false
        default: active
        choices: [active, passive, "on"]
        description: Channel-Modus (LACP active/passive oder on).
      port_channel_member_description:
        type: str
        required: false
        description: Interface-Description. Ohne Angabe wird sie nicht geschrieben.
      port_channel_member_service_policy_out:
        type: str
        required: false
        default: QUEUE-OUT
        description: Name of the policy-map applied as output service-policy.
      port_channel_member_enabled:
        type: bool
        required: false
        default: true
        description: Administrative state of the interface; false writes shutdown, true removes it.
