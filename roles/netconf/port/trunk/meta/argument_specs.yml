---
argument_specs:
  main:
    short_description: physical port als Trunk per NETCONF schreiben
    options:
      port_trunk_interface:
        type: str
        required: true
        description: Interface-Name, z.B. GigabitEthernet1/0/6.
      port_trunk_description:
        type: str
        required: true
        description: Interface-Description.
      port_trunk_allowed_vlans:
        type: raw
        required: true
        description: >-
          Erlaubte VLANs: der String all (NetBox tagged-all), eine Liste
          (z.B. [100, 200, 300]), ein Range-String (z.B. 2-4094 oder 1,20-30)
          oder eine gemischte Liste (z.B. [1, "20-30", 100]). Gueltig 1-4094.
      port_trunk_native_vlan:
        type: int
        required: false
        default: null
        description: Native-VLAN (NetBox untagged). Ohne Angabe wird ein vorhandenes Native-VLAN entfernt.
      port_trunk_no_cdp_enable:
        type: bool
        required: false
        default: null
        description: CDP auf dem Port deaktivieren (cdp enable = false). Bei false/ohne Angabe wird die Einstellung entfernt.
      port_trunk_no_lldp_transmit:
        type: bool
        required: false
        default: null
        description: LLDP-Senden deaktivieren (no lldp transmit). Bei false/ohne Angabe wird die Einstellung entfernt.
      port_trunk_no_lldp_receive:
        type: bool
        required: false
        default: null
        description: LLDP-Empfang deaktivieren (no lldp receive). Bei false/ohne Angabe wird die Einstellung entfernt.
      port_trunk_rep:
        type: bool
        required: false
        default: null
        description: >-
          REP-Segment schreiben. Alles wird aus dem Interface abgeleitet:
          Segment-ID = Port-Nummer (1/0/5 -> 5); Switch 1 = edge no-neighbor primary
          (aktiver Flexlink+-Port), Switch 2 = edge no-neighbor preferred (Standby);
          andere Switch-Nummern sind ein Fehler. Bei false/ohne Angabe wird REP entfernt.
      port_trunk_nonegotiate:
        type: bool
        required: false
        default: null
        description: >-
          Configure 'switchport nonegotiate' on the port. Bei false/ohne Angabe wird die Einstellung entfernt.
      port_trunk_service_policy_out:
        type: str
        required: false
        default: QUEUE-OUT
        description: Name of the policy-map applied as output service-policy.
      port_trunk_enabled:
        type: bool
        required: false
        default: true
        description: Administrative state of the interface; false writes shutdown, true removes it.
      port_trunk_storm_rising:
        type: float
        required: false
        default: 10.0
        description: Storm-control rising threshold in percent, used for broadcast and multicast.
      port_trunk_storm_falling:
        type: float
        required: false
        default: 0.0
        description: Storm-control falling threshold in percent, used for broadcast and multicast.
