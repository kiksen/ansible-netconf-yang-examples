---
# Required: port_channel_interface, port_channel_description
# mode trunk (default): port_channel_allowed_vlans is required, port_channel_native_vlan optional.
# mode access: port_channel_access_vlan is required, the trunk parameters must not be set.
port_channel_mode: trunk
port_channel_allowed_vlans: null
port_channel_access_vlan: null
port_channel_native_vlan: null
port_channel_enabled: true
# Storm-control thresholds (percent), applied to both broadcast and multicast.
port_channel_storm_rising: 10.0
port_channel_storm_falling: 0.0
