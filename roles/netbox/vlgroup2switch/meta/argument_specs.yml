---
argument_specs:
  main:
    short_description: Write the active VLANs of a NetBox VLAN group to the switch
    description:
      - Reads the VLANs of the NetBox VLAN group, keeps only the active ones and writes them with
        the role netconf/system/vlan. That role replaces the whole VLAN list of the switch, so all
        other VLANs are removed, and it rejects names that do not fit the switch (see its spec).
      - NetBox is only read. Needs the environment variables NETBOX_ENDPOINT and NETBOX_TOKEN.
      - VLAN 1 is not written because the switch keeps it as default.
      - VLANs listed in vlgroup2switch_protected_vlans are not removed from the switch. A protected
        VLAN that is in the group is written as NetBox has it. One that is not in the group is added
        to the list with the name <vid>_protected (e.g. 600_protected), also when it does not exist
        on the switch yet; an existing name on the switch is overwritten. The switch is not read.
    options:
      vlgroup2switch_group_id:
        type: int
        required: true
        description: ID of the NetBox VLAN group, e.g. 34.
      vlgroup2switch_protected_vlans:
        type: list
        elements: int
        required: false
        default: []
        description: >-
          VLAN IDs that are never removed from the switch, e.g. [1, 600] for the default VLAN
          and the WAN VLAN. VLAN 1 is accepted but never written.
