---
# No source: the stack state is operational data, so this is a <get>, not a <get-config>.
# display json lets the module convert the reply, so no parser is needed.
- name: Read the stack data
  ansible.netcommon.netconf_get:
    display: json
    filter: "{{ lookup('ansible.builtin.template', 'get_filter.xml.j2') }}"
  register: system_stack_get_result

# The converter returns a dict for one element and a list for several, so both are normalized.
- name: Build the stack facts
  ansible.builtin.set_fact:
    system_stack_members: "{{ [system_stack_nodes] if system_stack_nodes is mapping else system_stack_nodes }}"
    system_stack_info: "{{ system_stack_data.get('stack-info', {}) }}"
  vars:
    system_stack_data: "{{ system_stack_get_result.output.get('data', {}).get('stack-oper-data', {}) }}"
    system_stack_nodes: "{{ system_stack_data.get('stack-node', []) }}"
