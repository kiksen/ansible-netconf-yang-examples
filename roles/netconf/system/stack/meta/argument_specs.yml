---
argument_specs:
  main:
    short_description: Read the stack members and the stack status
    description:
      - Has no parameters. Sets system_stack_members and system_stack_info (Cisco-IOS-XE-stack-oper).
      - system_stack_members is a list with one dict per stack node (chassis-number, role,
        node-state, priority, mac-address, serial-number, stack-ports, ...).
      - system_stack_info is a dict with size, ring-status, stack-mac-address and stack-boottime.
      - Keys keep the YANG names with hyphens; read them with item['node-state'].
    options: {}
