---
argument_specs:
  main:
    short_description: Write a port as port-channel member
    options:
      port_channel_member_interface:
        type: str
        required: true
        description: Interface name of the physical port, e.g. GigabitEthernet1/0/7.
      port_channel_member_number:
        type: int
        required: true
        description: Number of the port-channel (channel-group).
      port_channel_member_mode:
        type: str
        required: false
        default: active
        choices: [active, passive, "on"]
        description: Channel mode (LACP active/passive or on).
      port_channel_member_description:
        type: str
        required: false
        description: Interface description. Without a value it is not written.
      port_channel_member_service_policy_out:
        type: str
        required: false
        default: QUEUE-OUT
        description: Name of the policy-map applied as output service-policy.
      port_channel_member_enabled:
        type: bool
        required: false
        default: true
        description: Administrative state of the interface; false writes shutdown, true removes it.
