---
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check
      - run: uv run pytest
      - run: uv run ansible-lint
      - name: Build the collection
        run: uv run ansible-galaxy collection build --output-path dist .
