---
# All system facts in one example: show version, show inventory, the stack and the VLANs.
#   uv run ansible-playbook -i inventory.yaml system_facts.yaml
# Interface facts have their own examples: interface_facts.yaml and channel_facts.yaml.
- name: Example - read show version, show inventory and the stack per NETCONF
  hosts: switch
  gather_facts: false

  roles:
    - role: netconf/system/facts

  post_tasks:
    - name: Show the version data
      ansible.builtin.debug:
        msg: "{{ system_facts_hostname }} {{ system_facts_version }}: {{ system_facts_system }}"

    - name: Show the inventory
      ansible.builtin.debug:
        msg: >-
          {{ item['dev-name'] | default('') }}: {{ item['hw-description'] | default('') }},
          pid={{ item['part-number'] | default('') }}, sn={{ item['serial-number'] | default('') }}
      loop: "{{ system_facts_inventory }}"
      loop_control:
        label: "{{ item['dev-name'] | default(item['hw-type'] | default('')) }}"

    - name: Show the stack members
      ansible.builtin.debug:
        msg: >-
          Switch {{ item['chassis-number'] }}: {{ item.role }}, {{ item['node-state'] }},
          priority={{ item.priority }}, mac={{ item['mac-address'] }}, sn={{ item['serial-number'] }}
      loop: "{{ system_facts_stack_members }}"
      loop_control:
        label: "{{ item['chassis-number'] }}"

    - name: Show the stack status
      ansible.builtin.debug:
        var: system_facts_stack_info

    - name: Show the VLANs
      ansible.builtin.debug:
        msg: "{{ item.id }} {{ item.name | default('') }} ({{ item.status | default('') }})"
      loop: "{{ system_facts_vlans }}"
      loop_control:
        label: "{{ item.id }}"

    - name: Show the VLAN facts
      ansible.builtin.debug:
        msg: "{{ system_facts_vlans }}"
