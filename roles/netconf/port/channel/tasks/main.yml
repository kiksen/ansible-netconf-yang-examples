- name: Validate the parameters of the port-channel mode
  ansible.builtin.assert:
    that:
      - >-
        port_channel_mode == 'access'
        or (port_channel_allowed_vlans is not none and port_channel_access_vlan is none)
      - >-
        port_channel_mode != 'access'
        or (port_channel_access_vlan is not none and port_channel_allowed_vlans is none
        and port_channel_native_vlan is none)
    fail_msg: >-
      Mode trunk needs port_channel_allowed_vlans and no port_channel_access_vlan;
      mode access needs port_channel_access_vlan and neither port_channel_allowed_vlans
      nor port_channel_native_vlan.
    quiet: true

- name: "Write port-channel trunk with edit-config (replace in template) on {{ port_channel_interface }}"
  ansible.netcommon.netconf_config:
    target: running
    get_filter: "{{ lookup('ansible.builtin.template', 'get_filter.xml.j2') }}"
    content: "{{ lookup('ansible.builtin.template', 'port_channel.xml.j2') }}"
  register: port_channel_edit_result
  retries: 5
  delay: 5
  until: port_channel_edit_result is not failed or 'locked' not in (port_channel_edit_result.msg | default(''))
  notify: netconf save config
