---
- name: "Write port-channel member with edit-config (replace in template) on {{ port_channel_member_interface }}"
  ansible.netcommon.netconf_config:
    target: running
    get_filter: "{{ lookup('ansible.builtin.template', 'get_filter.xml.j2') }}"
    content: "{{ lookup('ansible.builtin.template', 'channel_member.xml.j2') }}"
  register: port_channel_member_edit_result
  retries: 5
  delay: 5
  until: port_channel_member_edit_result is not failed or 'locked' not in (port_channel_member_edit_result.msg | default(''))
  notify: netconf save config
