---
# No source: the stack state is operational data, so this is a <get>, not a <get-config>.
# Only the member table is read: the whole MIB is backed by SNMP and can exceed the timeout.
- name: Read the stack data
  ansible.netcommon.netconf_get:
    display: xml
    filter: "{{ lookup('ansible.builtin.template', 'get_filter.xml.j2') }}"
  register: system_stack_get_result

- name: Build the stack facts
  ansible.builtin.set_fact:
    system_stack_all: "{{ system_stack_get_result.stdout | stack_facts }}"
    system_stack_raw: "{{ system_stack_get_result.stdout }}"

- name: Split the stack facts
  ansible.builtin.set_fact:
    system_stack_globals: "{{ system_stack_all.globals }}"
    system_stack_tables: "{{ system_stack_all.tables }}"
    system_stack_members: "{{ system_stack_all.members }}"
