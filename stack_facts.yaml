---
- name: Example - read the stack members per NETCONF
  hosts: switch
  gather_facts: false

  roles:
    - role: netconf/system/stack

  post_tasks:
    - name: Show the stack members
      ansible.builtin.debug:
        msg: >-
          Switch {{ item['chassis-number'] }}: {{ item.role }}, {{ item['node-state'] }},
          priority={{ item.priority }}, mac={{ item['mac-address'] }}, sn={{ item['serial-number'] }}
      loop: "{{ system_stack_members }}"
      loop_control:
        label: "{{ item['chassis-number'] }}"

    - name: Show the stack status
      ansible.builtin.debug:
        var: system_stack_info
