---
argument_specs:
  main:
    short_description: Write a physical port as trunk per NETCONF
    options:
      port_trunk_interface:
        type: str
        required: true
        description: Interface-Name, z.B. GigabitEthernet1/0/6.
      port_trunk_description:
        type: str
        required: true
        description: Interface description.
      port_trunk_allowed_vlans:
        type: raw
        required: true
        description: >-
          Allowed VLANs: the string all (NetBox tagged-all), a list
          (e.g. [100, 200, 300]), a range string (e.g. 2-4094 or 1,20-30)
          or a mixed list (e.g. [1, "20-30", 100]). Valid range 1-4094.
      port_trunk_native_vlan:
        type: int
        required: false
        default: null
        description: Native VLAN (NetBox untagged). Without a value an existing native VLAN is removed.
      port_trunk_no_cdp_enable:
        type: bool
        required: false
        default: null
        description: Disable CDP on the port (cdp enable = false). With false or without a value the setting is removed.
      port_trunk_no_lldp_transmit:
        type: bool
        required: false
        default: null
        description: Disable LLDP transmit (no lldp transmit). With false or without a value the setting is removed.
      port_trunk_no_lldp_receive:
        type: bool
        required: false
        default: null
        description: Disable LLDP receive (no lldp receive). With false or without a value the setting is removed.
      port_trunk_rep:
        type: bool
        required: false
        default: null
        description: >-
          Write the REP segment. Everything is derived from the interface:
          segment ID = port number (1/0/5 -> 5); switch 1 = edge no-neighbor primary
          (active Flexlink+ port), switch 2 = edge no-neighbor preferred (standby);
          other switch numbers are an error. With false or without a value REP is removed.
      port_trunk_nonegotiate:
        type: bool
        required: false
        default: null
        description: >-
          Configure 'switchport nonegotiate' on the port. With false or without a value the setting is removed.
      port_trunk_service_policy_out:
        type: str
        required: false
        default: QUEUE-OUT
        description: Name of the policy-map applied as output service-policy.
      port_trunk_enabled:
        type: bool
        required: false
        default: true
        description: Administrative state of the interface; false writes shutdown, true removes it.
      port_trunk_storm_rising:
        type: float
        required: false
        default: 10.0
        description: Storm-control rising threshold in percent, used for broadcast and multicast.
      port_trunk_storm_falling:
        type: float
        required: false
        default: 0.0
        description: Storm-control falling threshold in percent, used for broadcast and multicast.
